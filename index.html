<!DOCTYPE html>
<html>
<head>
    <title>Smart Pharmacy Rack</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            text-align: center;
            padding: 40px;
        }

        h1 {
            color: #1d3557;
        }

        .rack {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 50px;
        }

        .shelf {
            width: 180px;
            height: 180px;
            background: white;
            border: 3px solid #1d3557;
            border-radius: 12px;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            cursor: pointer;

            transition: 0.2s;
        }

        .shelf:hover {
            transform: scale(1.05);
            background: #e8f1ff;
        }

        .medicine {
            font-size: 50px;
        }

        .shelf-name {
            font-size: 20px;
            font-weight: bold;
            margin-top: 15px;
        }

        #status {
            margin-top: 40px;
            font-size: 22px;
            font-weight: bold;
            color: #1d3557;
        }
    </style>
</head>

<body>

    <h1>💊 Smart Pharmacy Rack</h1>

    <div class="rack">

        <div class="shelf" id="shelf1" data-shelf="1">
            <div class="medicine">💊</div>
            <div class="shelf-name">Shelf 1</div>
        </div>

        <div class="shelf" id="shelf2" data-shelf="2">
            <div class="medicine">💊</div>
            <div class="shelf-name">Shelf 2</div>
        </div>

        <div class="shelf" id="shelf3" data-shelf="3">
            <div class="medicine">💊</div>
            <div class="shelf-name">Shelf 3</div>
        </div>

    </div>

    <div id="status">
        Connecting to WebSocket...
    </div>


    <script>

        // Find all shelves on the webpage
        const shelves = document.querySelectorAll(".shelf");

        // Find the status text
        const status = document.getElementById("status");


        // Connect to our Python WebSocket server
        const socket = new WebSocket("ws://localhost:8765");


        // This runs when the connection succeeds
        socket.onopen = function() {

            console.log("Connected to WebSocket server");

            status.innerText = "WebSocket connected!";
        };


        // This runs if the connection closes
        socket.onclose = function() {

            console.log("Disconnected from server");

            status.innerText = "WebSocket disconnected";
        };


        // This runs if there is an error
        socket.onerror = function(error) {

            console.log("WebSocket error:", error);

            status.innerText = "WebSocket error";
        };


        // Watch every shelf
        shelves.forEach(function(shelf) {

            shelf.addEventListener("mouseenter", function() {

                // Get the shelf number
                const shelfNumber = shelf.dataset.shelf;


                // Display it on the webpage
                status.innerText =
                    "Shelf " + shelfNumber + " accessed!";


                // Show what we're sending in the browser console
                console.log(
                    "Sending: SHELF " + shelfNumber
                );


                // Send the message to the WebSocket server
                socket.send("SHELF " + shelfNumber);

            });

        });

    </script>

</body>
</html>
